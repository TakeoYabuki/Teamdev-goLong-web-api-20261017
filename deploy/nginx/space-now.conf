server {
    listen 80;
    server_name 143.198.80.71;

    # 証明書の取得・自動更新に使用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # 通常のアクセスはHTTPSへ転送
    location / {
        return 301 https://143.198.80.71$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 143.198.80.71;

    ssl_certificate /etc/letsencrypt/live/143.198.80.71/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/143.198.80.71/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 302 /web/;
    }

    location /web/ {
        alias /opt/space-now/web/;
        index index.html;
    }

    location /docs/ {
        alias /opt/space-now/docs/;
        index index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
