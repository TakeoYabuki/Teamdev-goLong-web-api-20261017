    get:
      tags: [ISS]
      x-owner: A
      summary: ISSの現在位置とデータ時刻
      description: TODO
      responses:
        "200":
          description:
          content:
            application/json:
              schema:

  
  # -----------------------------------
  /api/iss/passes:
    get:
      tags: [ISS]
      x-owner: A （雲量の照合と判定の説明は B）
      summary: 
      description: TODO
      responses:
        "200":
          description:
          content:
            application/json:
              schema:
  # -----------------------------------
  /api/iss/passes{id}:
    get:
      tags: [ISS]
      x-owner: A
      summary: 通過1件の詳細と判定理由
      description: TODO（スナップショットの保持期間、404になる条件）
      parameters:

      responses:
        "200":
          description:
          content:
            application/json:
              schema:
  # -----------------------------------
  /api/locations/search:
    get:
      tags: [都市]
      x-owner: C
      summary: 固定都市の検索・一覧
      description: |
        固定都市マスターを表示の部分一致で検索します。
        qを省略すると、すべての都市をページ分けして返します。
        並び順は都市マスターの登録順です。
        該当なし・範囲外ページでは200と空配列を返します。
      parameters:
        - name: q
          in: query
          required: false
          description: TODO
          schema: { type: string }
          example: 鹿児島
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: page
          in: query
          requird: false
          description: TODO説明
          schema: 
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: TODO説明
          schema:
            type: inteder
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchResponse"
              example: 鹿児島
              results:
                - id: kagoshima
                  name: 鹿児島市
                  lat: 31.5966
                  lon: 130.5571
              page: 1
              limit: 10
              total: 1
              totalPages: 1
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "500": { $ref: "#/components/responses/InternalError" }


# ==================================================
# 共通の部品
# ==================================================
components:
  schemas:
    Location:
      type: object
      required:
        - id
        - name
        - lat
        - lon
      properties:
        id:
          type: string
          description: 都市ID
          example: kagoshima
        name:
          type: string
          description: 都市の表示名
          example: 鹿児島市
        lat:
          type: number
          format: double
          description: 代表地点の緯度（度）
        lon:
          type: number
          format: double
          description: 代表地点の経度（度）
    LocationSearchResponse:
      type: object
      required: 
        - query
        - results
        - page
        - limit
        - total
        - totalPages
      properties:
        query:
          type: string
          description: 前後の空白を除去した検索語。省略時は空文字
        results:
          type: array
          description: 指定ページの都市一覧。該当なしの場合は空配列
          items:
            $ref: "#/components/schemas/Location"
        page:
          type: integer
          description: リクエストされたページ番号
        limit:
          type: integer
          description: 1ページの取得件数
        total:
          type: integer
          description: 検索に一致した都市の総件数
        totalPages:
          type: integer
          description: 総ページ数。検索結果が0件なら0
    ErrorResponse:
      type: object
      required: 
        - code
        - message
      properties:
        code:
          type: string
          description: エラーコード
        message:
          type: string
          description: エラーの説明
        

