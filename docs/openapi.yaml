openapi: 3.0.3

info:
  title: Space now API
  description: |
    ISSの現在位置と都市別の通過予測を提供するAPI

       ## 共通仕様
    - 正常・エラーともに Content-Type は application/json
    - 日時は日本時間の RFC 3339 形式（例：2026-10-19T18:42:10+09:00）
    - メソッドは GET のみ。GET 以外は 405（Allow: GET を付与）
    - 定義されていないパスは 404（NOT_FOUND）
    - 開発用に Access-Control-Allow-Origin: * を付与
    - エラーはすべて ErrorResponse の形式で返す
 
    TODO（担当: B）：エラーコードの一覧、CORS、キャッシュの方針を追記する
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: ISS
    description: ISSの現在位置と通過予測
  - name: 都市
    description: 固定都市検索マスターの検索
  - name: システム
    description: 動作確認用

