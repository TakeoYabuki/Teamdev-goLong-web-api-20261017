<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Space now | ISS観測マップ</title>

        <!-- LeafletのCSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />

        <!-- 自分たちのCSS -->
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="app">
            <!-- タイトル -->
             <header class="site-header">
                <h1 class="site-title">Space nows<span>.</span></h1>
                <p class="site-description">次のISS観測チャンスを見つけよう</p>
             </header>

        </main>
        <h1>Space now</h1>

        <label for="city-select">観測する都市</label>

        <select id="city-select">
            <option value="tokyo">東京都心</option>
            <option value="osaka">大阪市</option>
            <option value="kagoshima">鹿児島市</option>
        </select>

        <p id="selected-city">観測地点：東京都心</p>

        <div class="map-actions">
            <button id="focus-city" type="button">観測地点へ移動</button>
            <button id="show-world" type="button">世界全体に戻す</button>
        </div>

        <!-- この中に地図が表示される -->
        <div id="map"></div>

        <p id="iss-status">ISSは動作確認用の仮の位置です。</p>

        <!-- Leafletを先に読み込む -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <!-- その後で自分たちのJavaScriptを読み込む -->
        <script src="app.js"></script>
    </body>
</html>
